name: Monthly Dependency Refresh
on:
  schedule:
    - cron: "23 4 6 * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: deps-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Refresh lockfile
        run: uv lock --upgrade
      # Must mirror ci.yml exactly. The PR this job opens is authored by
      # github-actions[bot], so its workflow runs can be parked at
      # action_required by the repo's fork-PR approval policy, leaving the PR
      # with zero check runs. This step is then the only gate the refresh gets,
      # and a lockfile bump can move ruff itself, so lint and format must run
      # here too, not just pytest.
      - name: Validate (install + lint + format + tests)
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest || exit_code=$?
          if [ "${exit_code:-0}" -eq 5 ]; then echo "No tests collected, skipping"; else exit ${exit_code:-0}; fi
      - name: Open PR with refreshed lockfile
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PUSH_PAT || github.token }}
          branch: deps/monthly-refresh
          delete-branch: true
          commit-message: "deps: monthly lockfile refresh"
          title: "deps: monthly dependency refresh"
          body: |
            Automated monthly refresh of uv.lock to the latest resolver-compatible
            versions. CI passed on this branch. Review and merge if green.
          labels: dependencies
