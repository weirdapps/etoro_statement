# SonarCloud configuration for Python projects

sonar.organization=weirdapps
sonar.projectKey=weirdapps_etoro_statement
sonar.projectName=etoro_statement

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.11

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
# .github/** is excluded on evidence, not taste: YAML was billing 3,362
# ncloc across the org and had produced exactly zero issues in any of the
# thirteen projects. On the free plan's 50,000-line ceiling that is 7% of
# the budget for no findings. Re-include it if Sonar's Actions rules ever
# grow teeth.
sonar.exclusions=\
  .github/**,\
  **/tests/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/*.egg-info/**,\
  **/dist/**,\
  **/build/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py
